services:
  redis:
    image: redis:alpine
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  chat_server:
    build: ./server
    ports:
      - "50000:50000"
    depends_on:
      - redis
    environment:
      - REDIS_HOST=redis

volumes:
  redis_data: